# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, staging]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # The previous R minor. Institutional and Connect installs lag the
          # current release, so `release`-only would not notice a break for
          # them. This row is also what DESCRIPTION's floor is based on: we
          # declare only what CI actually exercises.
          #
          # NOTE: `oldrel-1` moves every April. When R 4.6 ships this becomes
          # 4.5, and Depends: R (>= 4.4.0) would no longer be the version being
          # tested -- either raise the floor to match, or pin this row to the
          # declared floor instead.
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  dispatch-canaries:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: R-CMD-check
    runs-on: ubuntu-latest
    env:
      CANARY_TOKEN: ${{ secrets.CSIAPPS_CANARY_TOKEN }}
    steps:
      - name: Redeploy the R canaries
        shell: bash
        run: |
          if [[ -z "$CANARY_TOKEN" ]]; then
            echo "CSIAPPS_CANARY_TOKEN is not configured"
            exit 1
          fi
          payload=$(printf '{"event_type":"csiapps-r-staging","client_payload":{"source_repo":"%s","ref":"staging","sha":"%s"}}' "$GITHUB_REPOSITORY" "$GITHUB_SHA")
          for repo in dummy-r-shiny dummy-r-quarto; do
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $CANARY_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/CSIOntario/$repo/dispatches" \
              --data "$payload"
            echo "Dispatched $GITHUB_SHA to $repo"
          done
